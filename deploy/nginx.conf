# nginx in front of the MarketMate SPA.
#
# It proxies /api and /graphql to the API so the browser stays on one origin:
# no CORS preflight on every request, and the bundle can be built once with
# relative URLs instead of a baked-in API hostname.

upstream marketmate_api {
    # The Compose service name and the Kubernetes Service name are the same by
    # design, so this literal is correct in both. Not templated: nginx does no
    # environment substitution in a plain conf file.
    server marketmate-api:8081;
}

server {
    # 5173 to match the platform contract's published port, so the container
    # port, the compose mapping and the Kubernetes Service agree on one number.
    listen 5173;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://marketmate_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A cold video — transcript fetch plus an LLM extraction — genuinely
        # takes tens of seconds on first request. It is cached permanently
        # afterwards, but the first one must not be cut off at 60s.
        proxy_read_timeout 180s;
    }

    location /graphql {
        proxy_pass http://marketmate_api;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    location /graphiql {
        proxy_pass http://marketmate_api;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
